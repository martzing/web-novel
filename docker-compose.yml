services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mokchan
      POSTGRES_PASSWORD: mokchan
      POSTGRES_DB: mokchan
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mokchan -d mokchan"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ENV: development
      DATABASE_URL: postgres://mokchan:mokchan@postgres:5432/mokchan?sslmode=disable
      # Must be at least 16 characters or the API refuses to start.
      JWT_SECRET: dev-secret-change-me-please
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
      PAYMENTS_MOCK_ENABLED: "true"
      UPLOAD_DIR: /app/uploads
      PUBLIC_UPLOAD_BASE: /uploads
      # Development runs the background jobs inside the API, so no separate
      # worker service is needed for a complete system.
      RUN_JOBS_IN_API: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  pg_data:
  uploads:
